apiVersion: v1
kind: ConfigMap
metadata:
  name: constraint-enforcement-config
  namespace: constraint-enforcement
  labels:
    app: constraint-enforcement-engine
data:
  HOST: "0.0.0.0"
  PORT: "5000"
  WORKERS: "4"
  LOG_LEVEL: "INFO"
  LOG_FORMAT: "json"
  METRICS_ENABLED: "true"
  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_DEFAULT: "100 per minute"
  MAX_CONTENT_LENGTH: "1048576"
  REQUEST_TIMEOUT: "30"
  MAX_THRESHOLD: "1000"
  SIMULATION_MAX_DEPTH: "100"
  SIMULATION_TIMEOUT: "5.0"

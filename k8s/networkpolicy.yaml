apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: constraint-enforcement-netpol
  namespace: constraint-enforcement
spec:
  podSelector:
    matchLabels:
      app: constraint-enforcement-engine
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    - namespaceSelector:
        matchLabels:
          name: monitoring
    ports:
    - protocol: TCP
      port: 5000
  egress:
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53
